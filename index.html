<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ed"><title>NOVA — общайся по-своему</title>
<style>
:root{--bg:#f7f3ed;--panel:#fffdf9;--panel2:#f0e8df;--text:#272321;--muted:#898078;--accent:#842f3c;--accent2:#f1dfe1;--line:#e8dfd6;--green:#47745f;--shadow:0 18px 50px #4b33200d;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}.app{min-height:100dvh;display:grid;grid-template-columns:250px minmax(300px,410px) minmax(340px,1fr);max-width:1600px;margin:auto;background:var(--panel);box-shadow:var(--shadow)}.sidebar{background:var(--bg);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px;font-weight:800;font-size:22px;letter-spacing:-.7px}.logo{width:39px;height:39px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-size:22px;font-weight:700}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2.4px;font-weight:600}.nav{display:grid;gap:7px}.nav button,.side-action{display:flex;align-items:center;gap:13px;text-align:left;padding:12px 13px;border-radius:14px;background:transparent;color:var(--muted);font-weight:600}.nav button.active{background:var(--accent2);color:var(--accent)}.ico{font-size:19px;width:23px;text-align:center}.sidebar-bottom{margin-top:auto;display:grid;gap:8px}.mini-profile{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:17px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#d8b8a8,#8b3c49);display:grid;place-items:center;color:white;font-weight:800;flex-shrink:0}.muted{color:var(--muted)}.small{font-size:12px}.list-panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.panel-head{padding:25px 20px 15px}.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.head-row h1{font-size:27px;letter-spacing:-1px;margin:0}.round-btn{width:39px;height:39px;border-radius:14px;background:var(--panel2);font-size:21px;display:grid;place-items:center}.search{margin-top:17px;position:relative}.search input{width:100%;border:1px solid transparent;border-radius:14px;background:var(--bg);padding:12px 14px 12px 39px;outline:none}.search span{position:absolute;left:13px;top:10px;color:var(--muted)}.filters{display:flex;gap:7px;padding:0 18px 13px;overflow:auto}.filter{white-space:nowrap;padding:8px 12px;border-radius:20px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}.filter.active{background:var(--accent);color:#fff}.chat-list{padding:0 10px 16px;overflow:auto}.chat-item{width:100%;display:flex;gap:12px;text-align:left;align-items:center;padding:12px 10px;border-radius:17px;background:transparent}.chat-item.active{background:var(--bg)}.chat-copy{flex:1;min-width:0}.chat-top,.chat-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center}.chat-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.time{font-size:10px;color:var(--muted);white-space:nowrap}.unread{font-size:10px;color:white;background:var(--accent);border-radius:10px;padding:2px 6px}.main{min-width:0;display:flex;flex-direction:column;min-height:100dvh;background:var(--panel)}.welcome{margin:auto;text-align:center;max-width:420px;padding:32px}.welcome-mark{margin:0 auto 20px;width:84px;height:84px;border-radius:28px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-size:42px;font-weight:700}.welcome h2{font-size:26px;letter-spacing:-.8px;margin:0 0 8px}.welcome p{color:var(--muted);line-height:1.7}.primary{background:var(--accent);color:white;border-radius:13px;padding:11px 16px;font-weight:700}.soft{background:var(--panel2);color:var(--text);border-radius:13px;padding:10px 13px;font-weight:650}.chat-view{display:flex;flex-direction:column;min-height:100dvh}.chat-header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.chat-header .chat-copy{flex:1}.chat-header-actions{display:flex;gap:7px}.message-area{flex:1;padding:22px;overflow:auto;background:radial-gradient(ellipse at top right,#f7eee9 0,transparent 55%)}.day-label{text-align:center;color:var(--muted);font-size:11px;margin:0 auto 22px;background:#fff9;padding:6px 11px;border-radius:20px;width:max-content}.message-row{display:flex;margin:12px 0}.message-row.mine{justify-content:flex-end}.bubble{max-width:min(78%,470px);padding:11px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 12px #2a160808;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:var(--accent);border-color:var(--accent);color:#fff;border-bottom-right-radius:6px}.message-row:not(.mine) .bubble{border-bottom-left-radius:6px}.bubble-meta{display:block;text-align:right;font-size:10px;opacity:.68;margin-top:4px}.composer{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:9px;background:var(--panel)}.composer textarea{flex:1;resize:none;max-height:130px;min-height:43px;border:1px solid var(--line);background:var(--bg);border-radius:17px;padding:11px 14px;outline:none}.send{width:43px;height:43px;border-radius:15px;background:var(--accent);color:#fff;font-size:19px}.section-view{padding:28px;overflow:auto;min-height:100dvh}.section-view h1{font-size:30px;letter-spacing:-1px;margin:0}.section-intro{color:var(--muted);margin:7px 0 23px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);color:var(--text)}.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.theme-choice{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:left;display:flex;align-items:center;gap:10px}.swatches{display:flex}.swatches i{width:18px;height:30px;display:block;border-radius:8px;margin-left:-3px;border:2px solid var(--panel)}.feed-post{padding:18px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin:14px 0}.post-head{display:flex;align-items:center;gap:10px}.post-body{margin:15px 0;line-height:1.65}.post-actions{display:flex;gap:16px;color:var(--muted)}.post-actions button{background:none;padding:3px}.clip-card{background:linear-gradient(145deg,var(--accent),#36252a);color:#fff;border-radius:22px;min-height:240px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;margin:12px 0}.empty-state{text-align:center;color:var(--muted);padding:36px 15px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#292321;color:white;padding:11px 16px;border-radius:13px;box-shadow:var(--shadow);z-index:20;max-width:90vw}.mobile-top,.mobile-nav{display:none}.hidden{display:none!important}.badge{font-size:10px;padding:4px 7px;background:var(--panel2);border-radius:9px;color:var(--muted)}
:root[data-theme="green"]{--bg:#f1f4ed;--panel:#fcfdf9;--panel2:#e3ebdf;--text:#242b25;--muted:#788277;--accent:#356b4e;--accent2:#dce9dd;--line:#dce4d7}:root[data-theme="bw"]{--bg:#f2f2f2;--panel:#fff;--panel2:#e8e8e8;--text:#181818;--muted:#777;--accent:#222;--accent2:#e4e4e4;--line:#e3e3e3}:root[data-theme="blue"]{--bg:#eef4fa;--panel:#fff;--panel2:#e0ebf7;--text:#1f2a37;--muted:#778596;--accent:#285f9e;--accent2:#dbe8f7;--line:#dce5ef}
@media(max-width:950px){.app{grid-template-columns:76px minmax(260px,350px) minmax(300px,1fr)}.sidebar{padding:20px 9px}.brand{justify-content:center;padding:0}.brand-copy,.nav-label,.sidebar-bottom .profile-copy,.side-action span:last-child{display:none}.nav button,.side-action{justify-content:center;padding:13px 8px}.mini-profile{justify-content:center;padding:8px}.sidebar-bottom{gap:6px}}
@media(max-width:680px){body{background:var(--panel)}.app{display:block;min-height:100dvh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}.sidebar{display:none}.list-panel{border:0;min-height:calc(100dvh - 66px - env(safe-area-inset-bottom))}.panel-head{padding:20px 18px 13px}.panel-head h1{font-size:29px}.chat-list{padding:0 10px}.chat-item{padding:12px 8px}.main{display:none;min-height:calc(100dvh - 66px - env(safe-area-inset-bottom))}.main.mobile-open{display:flex;position:fixed;inset:0 0 calc(62px + env(safe-area-inset-bottom));z-index:5;min-height:0}.chat-view{min-height:0;height:100%}.message-area{padding:18px 14px}.chat-header{padding:12px 14px}.composer{padding:10px 12px}.section-view{padding:22px 18px;min-height:100%;}.mobile-top{display:flex;align-items:center;gap:10px}.mobile-back{display:grid;place-items:center;width:35px;height:35px;background:var(--panel2);border-radius:12px}.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobile-nav button{display:grid;justify-items:center;gap:2px;padding:4px;background:transparent;color:var(--muted);font-size:10px}.mobile-nav button.active{color:var(--accent);font-weight:800}.mobile-nav .ico{font-size:20px}.theme-grid{grid-template-columns:1fr 1fr}.bubble{max-width:88%}}
@media(min-width:681px){.main{display:flex!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">N</div><div class="brand-copy">NOVA<small>YOUR SPACE</small></div></div><nav class="nav" id="sideNav"><button data-page="profile"><span class="ico">◉</span><span class="nav-label">Профиль</span></button><button data-page="feed"><span class="ico">▤</span><span class="nav-label">Лента</span></button><button data-page="messages" class="active"><span class="ico">☏</span><span class="nav-label">Сообщения</span></button><button data-page="clips"><span class="ico">▷</span><span class="nav-label">NOVA Clips</span></button></nav><div class="sidebar-bottom"><button class="side-action" data-page="settings"><span class="ico">⚙</span><span>Настройки</span></button><div class="mini-profile"><div class="avatar" id="sideAvatar">N</div><div class="profile-copy"><b id="sideName">Новый пользователь</b><div class="small muted" id="sideStatus">Локальный просмотр</div></div></div></div></aside>
<section class="list-panel" id="listPanel"><div class="panel-head"><div class="head-row"><h1>Сообщения</h1><button class="round-btn" id="createBtn" aria-label="Создать">＋</button></div><div class="search"><span>⌕</span><input id="chatSearch" placeholder="Поиск по чатам" autocomplete="off"></div></div><div class="filters" id="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="personal">Личные</button><button class="filter" data-filter="group">Группы</button><button class="filter" data-filter="channel">Каналы</button></div><div class="chat-list" id="chatList"></div></section>
<main class="main" id="main"><div class="welcome" id="welcome"><div class="welcome-mark">N</div><h2>Твоё пространство</h2><p>Выбери диалог слева или создай новый. Здесь будут твои личные сообщения, группы и каналы.</p><button class="primary" id="welcomeCreate">＋ Новый диалог</button><p class="small">Демо-интерфейс · данные пока хранятся только в этом браузере</p></div><div id="pageContent" class="hidden"></div><div id="chatView" class="chat-view hidden"></div></main>
</div>
<nav class="mobile-nav"><button data-page="profile"><span class="ico">◉</span>Профиль</button><button data-page="feed"><span class="ico">▤</span>Лента</button><button data-page="messages" class="active"><span class="ico">☏</span>Сообщения</button><button data-page="clips"><span class="ico">▷</span>Clips</button></nav>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={page:'messages',filter:'all',selected:null,theme:'burgundy',user:{name:'Новый пользователь',email:'',bio:'Здесь начинается твоя история в NOVA.',avatar:'N'},chats:[],posts:[{name:'NOVA',initial:'N',time:'Сегодня',text:'Добро пожаловать в NOVA — пространство для общения, идей и историй. Здесь появятся публикации каналов, на которые ты подпишешься.',likes:12,liked:false},{name:'NOVA Updates',initial:'N',time:'Вчера',text:'Мы строим NOVA постепенно: сначала надёжные сообщения и профили, затем сторис, каналы и короткие видео.',likes:8,liked:false}],clips:[],supabase:{url:'',key:''}};
const seed=[{id:'welcome',name:'NOVA',type:'channel',initial:'N',preview:'Добро пожаловать в NOVA',time:'сейчас',messages:[{mine:false,text:'Привет! 👋 Это демонстрационный чат NOVA. Здесь можно проверить внешний вид переписки. Сообщения пока сохраняются локально в этом браузере.',time:'сейчас'}]},{id:'ideas',name:'Идеи и заметки',type:'group',initial:'✦',preview:'Твоё пространство для идей',time:'вчера',messages:[]}];
function load(){try{const d=JSON.parse(localStorage.getItem('nova_demo_state')||'null');if(d&&Array.isArray(d.chats)){state.chats=d.chats;state.user={...state.user,...d.user};state.theme=d.theme||'burgundy';state.posts=d.posts||state.posts;state.clips=d.clips||[];state.supabase=d.supabase||state.supabase;}}catch(e){}if(!state.chats.length)state.chats=seed;applyTheme(state.theme);renderAll()}
function save(){try{localStorage.setItem('nova_demo_state',JSON.stringify({chats:state.chats,user:state.user,theme:state.theme,posts:state.posts,clips:state.clips,supabase:state.supabase}))}catch(e){toast('Не удалось сохранить данные в браузере')}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2800)}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(t){state.theme=t;document.documentElement.dataset.theme=({burgundy:'',green:'green',bw:'bw',blue:'blue'})[t]||'';saveNoLoop()}
function saveNoLoop(){try{const d=JSON.parse(localStorage.getItem('nova_demo_state')||'{}');d.theme=state.theme;localStorage.setItem('nova_demo_state',JSON.stringify(d))}catch(e){}}
function initials(name){return (name||'N').trim().slice(0,1).toUpperCase()||'N'}
function renderAll(){renderChats();$('#sideName').textContent=state.user.name;$('#sideAvatar').textContent=state.user.avatar||initials(state.user.name);$('#sideStatus').textContent=state.supabase.url?'Настроен URL Supabase':'Локальный просмотр';$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
function renderChats(){const q=$('#chatSearch').value.toLowerCase().trim();const list=state.chats.filter(c=>(state.filter==='all'||c.type===state.filter)&&(!q||(c.name+' '+(c.preview||'')+' '+c.messages.map(m=>m.text).join(' ')).toLowerCase().includes(q)));$('#chatList').innerHTML=list.length?list.map(c=>`<button class="chat-item ${state.selected===c.id?'active':''}" data-chat="${escapeHtml(c.id)}"><div class="avatar">${escapeHtml(c.initial||initials(c.name))}</div><div class="chat-copy"><div class="chat-top"><span class="chat-name">${escapeHtml(c.name)}</span><span class="time">${escapeHtml(c.time||'')}</span></div><div class="chat-bottom"><span class="preview">${escapeHtml(c.preview||'Нет сообщений')}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div></div></button>`).join(''):`<div class="empty-state">Ничего не найдено<br><span class="small">Попробуй изменить поиск или фильтр</span></div>`;$$('[data-chat]').forEach(b=>b.addEventListener('click',()=>openChat(b.dataset.chat)));}
function openChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;state.selected=id;state.page='messages';renderAll();$('#welcome').classList.add('hidden');$('#pageContent').classList.add('hidden');$('#chatView').classList.remove('hidden');$('#chatView').innerHTML=`<header class="chat-header"><button class="mobile-back" id="backChats" aria-label="Назад">‹</button><div class="avatar">${escapeHtml(c.initial||initials(c.name))}</div><div class="chat-copy"><div class="chat-name">${escapeHtml(c.name)}</div><div class="small muted">${c.type==='channel'?'Канал':c.type==='group'?'Группа':'Личный чат'} · NOVA demo</div></div><div class="chat-header-actions"><button class="round-btn" id="chatSearchBtn" title="Поиск">⌕</button><button class="round-btn" id="chatMore" title="Действия">···</button></div></header><div class="message-area" id="messageArea"><div class="day-label">Сегодня</div>${c.messages.map(m=>messageHtml(m)).join('')}</div><form class="composer" id="composer"><button type="button" class="round-btn" id="attachBtn" aria-label="Вложения">＋</button><textarea id="messageInput" rows="1" placeholder="Сообщение…" aria-label="Текст сообщения"></textarea><button class="send" type="submit" aria-label="Отправить">➤</button><input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" class="hidden"></form>`;$('#backChats').addEventListener('click',()=>{if(innerWidth<=680){$('#main').classList.remove('mobile-open');$('#listPanel').classList.remove('hidden')}});$('#composer').addEventListener('submit',sendMessage);$('#attachBtn').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)toast('Вложение выбрано: '+f.name+'. Реальная загрузка включается после настройки Storage.');e.target.value=''});$('#chatMore').addEventListener('click',()=>toast('Действия чата: расширенное меню добавим следующим этапом.'));$('#chatSearchBtn').addEventListener('click',()=>{const q=prompt('Найти текст в этом диалоге:');if(q){const m=c.messages.find(x=>x.text.toLowerCase().includes(q.toLowerCase()));toast(m?'Найдено сообщение: '+m.text.slice(0,70):'Совпадений нет')}});if(innerWidth<=680){$('#main').classList.add('mobile-open');$('#listPanel').classList.add('hidden')}scrollMessages();}
function messageHtml(m){return `<div class="message-row ${m.mine?'mine':''}"><div class="bubble">${escapeHtml(m.text)}<span class="bubble-meta">${escapeHtml(m.time||'сейчас')}${m.mine?' · ✓':''}</span></div></div>`}
function sendMessage(e){e.preventDefault();const input=$('#messageInput'),text=input.value.trim();if(!text)return;const c=state.chats.find(x=>x.id===state.selected);if(!c)return;c.messages.push({mine:true,text,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});c.preview=text;c.time='сейчас';save();openChat(c.id)}
function scrollMessages(){const el=$('#messageArea');if(el)el.scrollTop=el.scrollHeight}
function nav(page){state.page=page;renderAll();$('#welcome').classList.add('hidden');$('#chatView').classList.add('hidden');$('#pageContent').classList.remove('hidden');if(page==='messages'){if(state.selected)openChat(state.selected);else{$('#pageContent').classList.add('hidden');$('#welcome').classList.remove('hidden')}return}if(innerWidth<=680){$('#main').classList.add('mobile-open');$('#listPanel').classList.add('hidden')}renderPage(page)}
function renderPage(page){const p=$('#pageContent');let html='';if(page==='profile'){html=`<div class="mobile-top"><div class="logo">N</div><b>NOVA</b></div><h1>Профиль</h1><p class="section-intro">Твоё пространство, твои правила.</p><div class="card" style="text-align:center"><div class="avatar" style="width:78px;height:78px;margin:0 auto 12px;font-size:28px">${escapeHtml(state.user.avatar||initials(state.user.name))}</div><h2>${escapeHtml(state.user.name)}</h2><p class="muted">${escapeHtml(state.user.bio)}</p><button class="soft" data-action="edit-profile">Редактировать профиль</button></div><div class="card"><b>О тебе</b><p class="muted small">${escapeHtml(state.user.email||'Email пока не указан')}</p><p class="small">Профиль открыт по умолчанию. Управление видимостью появится в настройках приватности.</p></div>`}else if(page==='feed'){html=`<h1>Лента</h1><p class="section-intro">Публикации подписок и рекомендации по интересам.</p><div class="card"><b>Поделиться мыслью</b><textarea id="newPost" rows="3" placeholder="Что нового?" style="width:100%;margin:12px 0;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--bg)"></textarea><button class="primary" data-action="publish-post">Опубликовать</button></div>${state.posts.map((post,i)=>`<article class="feed-post"><div class="post-head"><div class="avatar">${escapeHtml(post.initial||'N')}</div><div><b>${escapeHtml(post.name)}</b><div class="small muted">${escapeHtml(post.time||'Сегодня')} · ${i===0?'Рекомендация':'Подписка'}</div></div></div><div class="post-body">${escapeHtml(post.text)}</div><div class="post-actions"><button data-like="${i}">${post.liked?'♥':'♡'} ${post.likes||0}</button><button data-action="comment">◯ Комментировать</button><button data-action="share">↗ Поделиться</button></div></article>`).join('')}`}else if(page==='clips'){html=`<h1>NOVA Clips</h1><p class="section-intro">Короткие видео — идеи, моменты и творчество.</p><div class="card"><b>Добавить ролик</b><p class="small muted">В демо можно создать карточку ролика. Настоящие видео нужно загружать в Supabase Storage.</p><div class="field"><label>Подпись</label><input id="clipCaption" placeholder="О чём это видео?"></div><button class="primary" data-action="add-clip">＋ Добавить ролик</button></div>${state.clips.length?state.clips.map(c=>`<div class="clip-card"><span class="badge">NOVA CLIPS</span><div><div style="font-size:34px">▷</div><h3>${escapeHtml(c.caption)}</h3><div class="small">${escapeHtml(c.time)}</div></div></div>`).join(''):'<div class="empty-state">Пока здесь тихо.<br>Первый ролик может начать твою ленту.</div>'}`}else if(page==='settings'){html=`<h1>Настройки</h1><p class="section-intro">Настрой NOVA под себя.</p><div class="card"><h3>Аккаунт</h3><div class="field"><label>Имя профиля</label><input id="settingName" value="${escapeHtml(state.user.name)}"></div><div class="field"><label>Email</label><input id="settingEmail" type="email" value="${escapeHtml(state.user.email)}" placeholder="you@example.com"></div><button class="primary" data-action="save-account">Сохранить профиль</button><p class="small muted">Это сохраняет демо-профиль локально. Реальная смена email требует Supabase Auth и подтверждения.</p></div><div class="card"><h3>Кастомизация профиля</h3><p class="muted small">Выбери двухцветную тему. Цвета меняют весь интерфейс.</p><div class="theme-grid"><button class="theme-choice" data-theme-choice="burgundy"><span class="swatches"><i style="background:#f7f3ed"></i><i style="background:#842f3c"></i></span><b>Бордовый · бежевый</b></button><button class="theme-choice" data-theme-choice="green"><span class="swatches"><i style="background:#f1f4ed"></i><i style="background:#356b4e"></i></span><b>Зелёный · бежевый</b></button><button class="theme-choice" data-theme-choice="bw"><span class="swatches"><i style="background:#fff"></i><i style="background:#222"></i></span><b>Чёрный · белый</b></button><button class="theme-choice" data-theme-choice="blue"><span class="swatches"><i style="background:#eef4fa"></i><i style="background:#285f9e"></i></span><b>Синий · белый</b></button></div></div><div class="card"><h3>Приватность</h3><p class="muted small">Профиль открыт по умолчанию. Реальные правила видимости должны проверяться базой, а не только переключателями в HTML.</p><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="privateToggle"> Сделать профиль закрытым (демо-переключатель)</label></div><div class="card"><h3>Подключение Supabase</h3><p class="muted small">Добавь Project URL и publishable/anon key. Никогда не вставляй service_role key в HTML. Подключение само по себе не создаёт недостающие таблицы или политики.</p><div class="field"><label>Project URL</label><input id="sbUrl" type="url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(state.supabase.url)}"></div><div class="field"><label>Publishable / anon key</label><textarea id="sbKey" rows="2" placeholder="eyJ…" style="resize:vertical">${escapeHtml(state.supabase.key)}</textarea></div><button class="primary" data-action="save-supabase">Сохранить настройки</button><button class="soft" data-action="test-supabase" style="margin-left:6px">Проверить доступность</button><p id="sbResult" class="small muted">Ключ хранится в локальном хранилище браузера этого демо. Не используй секретный service_role key.</p></div><div class="card"><h3>Безопасность</h3><p class="muted small">В реальной версии здесь будут смена пароля, активные сессии, подтверждение email и управление устройствами через Supabase Auth.</p><button class="soft" data-action="auth-info">О настройке авторизации</button></div>`}else{html='<h1>Сообщения</h1><p class="section-intro">Выбери чат или начни новый.</p>'}p.innerHTML=html;bindPageActions();}
function bindPageActions(){ $$('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>{applyTheme(b.dataset.themeChoice);save();toast('Тема применена')}));$$('[data-like]').forEach(b=>b.addEventListener('click',()=>{const post=state.posts[+b.dataset.like];if(!post)return;post.liked=!post.liked;post.likes=Math.max(0,(post.likes||0)+(post.liked?1:-1));save();renderPage('feed')}));$$('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='edit-profile'){const name=prompt('Имя профиля',state.user.name);if(name!==null&&name.trim()){state.user.name=name.trim();state.user.avatar=initials(name);save();renderAll();renderPage('profile')}}else if(a==='save-account'){const name=$('#settingName').value.trim(),email=$('#settingEmail').value.trim();if(!name){toast('Укажи имя профиля');return}state.user.name=name;state.user.avatar=initials(name);state.user.email=email;save();renderAll();toast('Профиль сохранён локально')}else if(a==='publish-post'){const text=$('#newPost').value.trim();if(!text){toast('Напиши текст публикации');return}state.posts.unshift({name:state.user.name,initial:initials(state.user.name),time:'Только что',text,likes:0,liked:false});save();renderPage('feed');toast('Публикация добавлена в демо-ленту')}else if(a==='add-clip'){const caption=$('#clipCaption').value.trim();if(!caption){toast('Добавь подпись к ролику');return}state.clips.unshift({caption,time:'Только что'});save();renderPage('clips');toast('Карточка ролика создана')}else if(a==='save-supabase'){const url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();if(url&&!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)){toast('Проверь URL проекта Supabase');return}if((url&&!key)||(!url&&key)){toast('Заполни оба поля или оставь оба пустыми');return}if(key.toLowerCase().includes('service_role')){toast('Service role key нельзя хранить в HTML');return}state.supabase={url,key};save();$('#sideStatus').textContent=url?'Настроен URL Supabase':'Локальный просмотр';$('#sbResult').textContent=url?'Настройки сохранены. Сетевые запросы и авторизация ещё не подключены в этом файле.':'Настройки подключения очищены.';toast('Настройки сохранены')}else if(a==='test-supabase'){const url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();if(!url||!key){toast('Сначала укажи URL и publishable/anon key');return}const result=$('#sbResult');result.textContent='Проверяем доступность проекта…';fetch(url+'/auth/v1/health',{headers:{apikey:key}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json().catch(()=>({ok:true}))}).then(()=>{result.textContent='Проект отвечает на запрос Auth. Это ещё не подтверждает схему таблиц или политики RLS.';toast('Supabase доступен')}).catch(()=>{result.textContent='Не удалось проверить Auth endpoint. Проверь URL, ключ, сеть и настройки проекта.';toast('Проверка не прошла')})}else if(a==='auth-info'){toast('Для входа нужны Supabase Auth, форма регистрации и проверка email; этот файл пока в режиме демо.')}else if(a==='comment'||a==='share'){toast('Эта функция запланирована для следующего этапа.')}}));const pt=$('#privateToggle');if(pt)pt.addEventListener('change',()=>toast(pt.checked?'Переключатель демо включён':'Переключатель демо выключен'))}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderChats()});$('#chatSearch').addEventListener('input',renderChats);$('#createBtn').addEventListener('click',createMenu);$('#welcomeCreate').addEventListener('click',createMenu);function createMenu(){const choice=prompt('Что создать?\n1 — личный чат\n2 — группу\n3 — канал');if(choice===null)return;const types={'1':'personal','2':'group','3':'channel'};if(!types[choice]){toast('Выбери 1, 2 или 3');return}const name=prompt('Название или имя:');if(!name||!name.trim())return;const c={id:'chat-'+Date.now(),name:name.trim(),type:types[choice],initial:initials(name),preview:'Новый диалог',time:'сейчас',messages:[]};state.chats.unshift(c);state.selected=c.id;save();renderChats();openChat(c.id);toast('Создан локальный демо-чат')}
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));window.addEventListener('resize',()=>{if(innerWidth>680){$('#main').classList.remove('mobile-open');$('#listPanel').classList.remove('hidden')}else if(state.page!=='messages'&&state.page){$('#main').classList.add('mobile-open');$('#listPanel').classList.add('hidden')}});
load();
})();
</script>
</body></html>
