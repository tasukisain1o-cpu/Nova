function recordMenu(){if(!window.MediaRecorder||!navigator.mediaDevices){toast('Запись недоступна. Можно прикрепить готовый файл.');return}modal('Записать сообщение',`<div class="menu-list"><button id="voice">${ic('mic')} Голосовое сообщение</button><button id="round">${ic('video')} Видеокружок · до 60 секунд</button></div>`);click('#voice',()=>record(false));click('#round',()=>record(true))}async function record(video){const chat=S.selected,stream=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{width:480,height:480,facingMode:'user'}:false});if(S.selected!==chat){stream.getTracks().forEach(t=>t.stop());return}const mime=(video?['video/webm;codecs=vp8,opus','video/webm','video/mp4']:['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4']).find(t=>MediaRecorder.isTypeSupported(t));let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(err){stream.getTracks().forEach(t=>t.stop());throw err}const r={rec,stream,chat,video,chunks:[],cancelled:false,start:Date.now(),bytes:0};S.record=r;rec.ondataavailable=e=>{if(e.data.size){r.chunks.push(e.data);r.bytes+=e.data.size;if(r.bytes>49*1048576){cancelRecord(true);toast('Запись слишком большая. Попробуй короче.')}}};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(r.timer);if(r.cancelled)return;try{const type=rec.mimeType||mime||'audio/webm',ext=type.includes('mp4')?'mp4':type.includes('ogg')?'ogg':'webm',file=new File(r.chunks,(video?'round':'voice')+'.'+ext,{type});toast('Отправляем запись…');const path=await upload('nova-chat-media',file,chat+'/'+S.user.id);await sendMedia({group_id:chat,sender_id:S.user.id,body:'',attachment_path:path,attachment_type:video?'video':'audio',message_kind:video?'round':'voice',client_id:uuid()})}catch(err){fail(err)}};rec.start(1000);$('#modal').close();$('#recordNote').classList.remove('hidden');$('#recordNote').innerHTML='<span id="recordTime">● Запись 0:00</span><button id="cancelRecord">Отменить</button>';$('#cancel function messageMenu(id){const m=S.messages.find(m=>m.id===id);if(!m)return;const mine=m.sender_id===S.user.id,c=S.chats.find(c=>c.id===S.selected);modal('Сообщение',`<p class="small muted truncate">${esc(m.body||'Вложение')}</p><div class="menu-list"><button id="replyMessage">Ответить</button>${mine?'<button id="editMessage">Изменить текст</button>':''}${mine||['owner','admin'].includes(c?.role)?'<button id="deleteMessage">Удалить сообщение</button>':''}</div>`);click('#replyMessage',()=>{if(!$('#messageText'))throw Error('В канале отвечать могут только редакторы.');S.reply=m;$('#replyNote').classList.remove('hidden');$('#replyNote').innerHTML=`<span class="truncate">Ответ: ${esc(m.body||'Вложение')}</span><button id="cancelReply">×</button>`;$('#cancelReply').onclick=()=>{S.reply=null;$('#replyNote').classList.add('hidden')};$('#modal').close();$('#messageText').focus()});click('#editMessage',()=>{modal('Изменить сообщение',`<textarea id="editBody" rows="4" maxlength="10000">${esc(m.body)}</textarea><button class="primary" id="saveEdit" style="margin-top:12px">Сохранить</button>`);click('#saveEdit',async()=>{const body=$('#editBody').value.trim();if(!body&&!m.attachment_path)throw Error('Напиши текст сообщения.');await query(db.from('messages').update({body}).eq('id',id));$('#modal').close();await messages();await chats()})});click('#deleteMessage',()=>{modal('Удалить сообщение?',`<p class="small muted">Оно исчезнет у всех участников чата.</p><button class="danger" id="confirmDelete">Удалить у всех</button>`);click('#confirmDelete',async()=>{await query(db.from('messages').delete().eq('id',id));$('#modal').close();S.messages=S.messages.filter(m=>m.id!==id);renderMessages();await chats()})})}
function createMenu(){modal('Новый разговор',`<div class="menu-list"><button id="findPerson">${ic('profile')} Найти человека</button><button id="newGroup">${ic('messages')} Создать группу</button><button id="newChannel">${ic('feed')} Создать канал</button><button id="findChannel">${ic('search')} Найти канал</button><button id="joinInvite">${ic('plus')} Войти по приглашению</button></div>`);click('#findPerson',findPerson);click('#newGroup',()=>createChat('group'));click('#newChannel',()=>createChat('channel'));click('#findChannel',findChannel);click('#joinInvite',()=>joinDialog())}$('#create').onclick=createMenu;$('#content').onclick=contentMenu;
function findPerson(){modal('Найти человека',`<form id="peopleSearch" class="row"><input id="peopleQuery" placeholder="Username без @" minlength="2" maxlength="24" required><button class="primary">Найти</button></form><div id="peopleResults" style="margin-top:18px" class="small muted">Поиск по уникальному имени пользователя.</div>`);$('#peopleSearch').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const q=$('#peopleQuery').value.trim().replace(/^@/,'').replace(/[%_]/g,'');if(q.length<2)throw Error('Введи хотя бы 2 символа.');const rows=await query(db.from('profiles').select('id,username,display_name,avatar_url,bio,is_private').ilike('username','%'+q+'%').neq('id',S.user.id).limit(20));rows.forEach(p=>S.people.set(p.id,p));$('#peopleResults').innerHTML=rows.map(p=>`<div class="person">${avatar(p.id)}<div class="grow"><b>${esc(p.display_name)}</b><div class="small muted">@${esc(p.username)}</div></div><button class="soft" data-person="${p.id}">Открыть</button></div>`).join('')||'Никого не найдено.';$$('[data-person]').forEach(b=>b.onclick=()=>person(b.dataset.person));hydrate($('#peopleResults'))})}}function person(id){const p=S.people.get(id);if(!p)return;modal(p.display_name,`<div class="row">${avatar(id,'big')}<div><b>@${esc(p.username)}</b><div class="small muted">${p.is_private?'Закрытый профиль':'Открытый профиль'}</div></div></div><p class="small muted" style="margin-top:20px;white-space:pre-wrap">${esc(p.bio)}</p><div class="stack"><button class="primary" id="direct">Написать сообщение</button><button class="soft" id="follow">Подписаться</button><button class="soft" id="block">Заблокировать</button></div>`);click('#direct',async()=>{const chat=await query(db.rpc('nova_open_direct',{p_user:id}));await chats();$('#modal').close();await openChat(chat)});click('#follow',async()=>{const result=await query(db.rpc('nova_follow',{p_target:id}));toast(result==='requested'?'Запрос на подписку отправлен':'Ты подписался на профиль');$('#modal').close()});click('#block',async()=>{await query(db.from('user_blocks').upsert({user_id:S.user.id,blocked_id:id}));$('#modal').close();toast('Пользователь заблокирован')})}
function createChat(kind){modal(kind==='channel'?'Создать канал':'Создать группу',`<form id="newChatForm" class="stack"><label class="field"><span>Название</span><input id="chatName" maxlength="80" required placeholder="Например, Наше пространство"></label><label class="setting"><span>Закрытый чат</span><input id="chatPrivate" type="checkbox" checked></label><p class="small muted">В закрытый чат можно попасть по приглашению.</p><button class="primary">Создать</button></form>`);$('#newChatForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const id=await query(db.rpc('nova_create_chat',{p_kind:kind,p_name:$('#chatName').value.trim(),p_private:$('#chatPrivate').checked}));await chats();$('#modal').close();await openChat(id)})}}function joinDialog(value=''){modal('Войти по приглашению',`<form id="joinForm" class="stack"><input id="invite" placeholder="Код или ссылка приглашения" required value="${esc(value)}"><button class="primary">Присоединиться</button></form>`);$('#joinForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{let code=$('#invite').value.trim();try{code=new URL(code).searchParams.get('invite')||code}catch{}const id=await query(db.rpc('nova_join_group',{p_invite_code:code}));await chats();$('#modal').close();history.replaceState(null,'',location.pathname);await openChat(id)})}}function findChannel(){modal('Найти канал',`<form id="channelSearch" class="row"><input id="channelQuery" placeholder="Название канала" maxlength="80"><button class="primary">Найти</button></form><div id="channelResults" style="margin-top:16px"></div>`);$('#channelSearch').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const q=$('#channelQuery').value.trim().replace(/[%_]/g,''),rows=await query(db.from('nova_groups').select('id,name,description').eq('kind','channel').eq('is_private',false).ilike('name','%'+q+'%').limit(20));$('#channelResults').innerHTML=rows.map(c=>`<div class="person"><div class="grow"><b>${esc(c.name)}</b><div class="small muted">${esc(c.description)}</div></div><button class="soft" data-subscribe="${c.id}">Открыть</button></div>`).join('')||'<p class="small muted">Каналов пока нет.</p>';$$('[data-subscribe]').forEach(b=>b.onclick=()=>run(b,async()=>{await query(db.rpc('nova_subscribe',{p_channel:b.dataset.subscribe}));await chats();$('#modal').close();await openChat(b.dataset.subscribe)}))})}}
async function chatInfo(c){if(c.kind==='personal')return person(c.peer_id);const[g,members]=await Promise.all([query(db.from('nova_groups').select('*').eq('id',c.id).single()),query(db.from('group_members').select('user_id,role').eq('group_id',c.id))]);await people(members.map(m=>m.user_id));modal(chatName(c),`<p class="small muted">${esc(g.description||'Здесь начинается ваше общение.')}</p><div class="card small"><b>Код приглашения</b><p style="margin-top:8px;overflow-wrap:anywhere">${esc(g.invite_code)}</p><button class="soft" id="copyInvite">Скопировать ссылку</button></div><div class="row"><button class="soft" id="mute">${c.muted?'Включить':'Выключить'} уведомления</button>${c.role!=='owner'?'<button class="soft" id="leave">Покинуть</button>':''}</div><h3 style="margin-top:24px">Участники</h3>${members.map(m=>`<div class="person">${avatar(m.user_id)}<div class="grow"><b>${esc(S.people.get(m.user_id)?.display_name||'Пользователь')}</b><div class="small muted">${esc(m.role)}</div></div>${c.role==='owner'&&m.user_id!==S.user.id?`<button class="soft" data-member="${m.user_id}">···</button>`:''}</div>`).join('')}`);click('#copyInvite',async()=>{await navigator.clipboard.writeText(location.origin+location.pathname+'?invite='+encodeURIComponent(g.invite_code));toast('Ссылка скопирована')});click('#mute',async()=>{await query(db.from('group_members').update({muted:!c.muted}).eq('group_id',c.id).eq('user_id',S.user.id));await chats();$('#modal').close();toast('Настройка сохранена')});click('#leave',async()=>{await query(db.rpc('nova_leave_group',{p_group_id:c.id}));S.selected=null;$('#modal').close();await chats();await go('messages')});$$('[data-member]').forEach(b=>b.onclick=()=>{modal('Участник',`<div class="menu-list"><button data-role="admin">Назначить администратором</button><button data-role="member">Сделать участником</button><button data-role="remove">Удалить из чата</button></div>`);$$('[data-role]').forEach(x=>x.onclick=()=>run(x,async()=>{await query(db.rpc(' function section(title,intro,body,extra=''){return `<section class="section"><div class="row spread"><div><span class="eyebrow">NOVA / YOUR SPACE</span><h1>${title}</h1></div>${extra}</div><p class="intro">${intro}</p>${body}</section>`}function contentMenu(){modal('Поделиться моментом',`<div class="menu-list"><button id="newStory">${ic('story')} Добавить сторис</button><button id="newClip">${ic('clips')} Видео в NOVA Clips</button><button id="newPost">${ic('feed')} Написать публикацию</button></div>`);click('#newStory',storyComposer);click('#newClip',clipComposer);click('#newPost',async()=>{$('#modal').close();await go('feed');$('#postBody')?.focus()})}
async function feed(){const gen=S.gen,[posts,stories]=await Promise.all([query(db.rpc('nova_feed',{p_limit:50,p_recommend:!!S.settings.recommendations})),query(db.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(30))]);await people([...posts.map(p=>p.author_id),...stories.map(s=>s.user_id)]);const likes=posts.length?await query(db.from('post_likes').select('post_id').eq('user_id',S.user.id).in('post_id',posts.map(p=>p.id))):[],liked=new Set(likes.map(x=>x.post_id));if(gen!==S.gen||S.page!=='feed')return;const owned=S.chats.filter(c=>c.kind==='channel'&&['owner','admin'].includes(c.role));$('#main').innerHTML=section('Лента','Подписки, мысли и моменты твоего круга.',`<div class="story-strip"><button id="addStory" class="story-item"><span class="avatar">${ic('plus')}</span>Моя история</button>${stories.map(s=>`<button class="story-item" data-story="${s.id}">${avatar(s.user_id)}<span class="truncate">${esc(S.people.get(s.user_id)?.display_name||'История')}</span></button>`).join('')}</div><button id="refreshFeed" class="soft hidden">Есть новые публикации · Обновить</button><form id="postForm" class="card"><div class="row">${avatar(S.user.id)}<b>Есть чем поделиться?</b></div><label class="field"><textarea id="postBody" rows="3" maxlength="10000" placeholder="Твои мысли…" required></textarea></label><input id="postTopics" placeholder="Темы через запятую, например: музыка, дизайн" maxlength="500"><div class="row" style="margin-top:12px"><select id="postChannel" aria-label="Где опубликовать"><option value="">В моём профиле</option>${owned.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="primary">Опубликовать</button></div></form>${posts.map(p=>`<article class="post"><div class="row">${avatar(p.author_id)}<div class="grow"><b>${esc(S.chats.find(c=>c.id===p.channel_id)?.name||S.people.get(p.author_id)?.display_name||'Публикация')}</b><div class="small muted">${day(p.created_at)} · ${clock(p.created_at)}</div></div></div><div class="post-text">${esc(p.body)}</div>${p.media_path?`<img class="dialog-media" alt="Изображение публикации" data-bucket="nova-social-media" data-path="${esc(p.media_path)}">`:''}<div class="post-actions"><button data-like="${p.id}" class="${liked.has(p.id)?'liked':''}" aria-pressed="${liked.has(p.id)}">${ic('heart')}${liked.has(p.id)?'Нравится':'Поддержать'}</button><button data-comments="${p.id}">${ic('messages')} Комментарии</button></div></article>`).join('')||'<div class="empty-list">Твоя лента пока чистая.<br>Подпишись на каналы или напиши первый пост.</div>'}`,`<button class="icon" id="feedContent" aria-label="Создать контент">${ic('plus')}</button>`);$('#feedContent').onclick=contentMenu;$('#addStory').onclick=storyComposer;click('#refreshFeed',feed);$('#postForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const body=$('#postBody').value.trim(),topics=parseTopics($('#postTopics').value);if(!body)throw Error('Напиши текст публикации.');await query(db.from('posts').insert({author_id:S.user.id,channel_id:$('#postChannel').value||null,body,topics}));await feed();toast('Публикация добавлена')})};$$('[data-story]').forEach(b=>b.onclick=()=>viewStory(stories.find(s=>s.id===b.dataset.story)));$$('[data-like]').forEach(b=>b.onclick=()=>run(b,async()=>{const on=b.ariaPressed==='true';if(on)await query(db.from('post_likes').delete().eq('post_id',b.dataset.like).eq('user_id',S.user.id));else await query(db.from('post_likes').insert({post_id:b.dataset.like,user_id:S.user.id}));b.ariaPressed=String(!on);b.classList.toggle('liked',!on);b.innerHTML=ic('heart')+(!on?'Нравится':'Поддержать')}));$$('[data-comments]').forEach(b=>b.onclick=()=>run(b,()=>comments(b.dataset.comments)));hydrate()}
async function comments(id){const rows=await query(db.from('post_comments').select('*').eq('post_id',id).order('created_at',{ascending:false}).limit(50));await people(rows.map(r=>r.user_id));modal('Комментарии',`${rows.reverse().map(r=>`<div class="person">${avatar(r.user_id)}<div class="grow"><b class="small">${esc(S.people.get(r.user_id)?.display_name||'Пользователь')}</b><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.body)}</div><span class="small muted">${day(r.created_at)}</span></div></div>`).join('')||'<p class="small muted">Стань первым в этом разговоре.</p>'}<form id="commentForm" class="row" style="margin-top:20px"><input id="commentBody" maxlength="4000" required placeholder="Твой комментарий"><button class="primary" aria-label="Отправить комментарий">${ic('send')}</button></form>`);$('#commentForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const body=$('#commentBody').value.trim();if(!body)return;await query(db.from('post_comments').insert({post_id:id,user_id:S.user.id,body}));await comments(id)})}}
function storyComposer(){modal('Новая история',`<form id="storyForm" class="stack"><textarea id="storyText" rows="4" maxlength="4000" placeholder="Что происходит сейчас?"></textarea><button type="button" class="soft" id="storyFile">${ic('image')} Фото или видео</button><span id="storyFilename" class="small muted"></span><label class="field"><span>Кто увидит</span><select id="storyAudience"><option value="public">Все пользователи</option><option value="followers">Подписчики</option><option value="private">Только я</option></select></label><p class="small muted">История видна 24 часа. Приватность профиля тоже учитывается.</p><button class="primary">Опубликовать историю</button></form>`);let file=null;$('#storyFile').onclick=async()=>{file=await pick('image/*,video/*');if(file&&$('#storyFilename'))$('#storyFilename').textContent=file.name};$('#storyForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const text=$('#storyText').value.trim(),audience=$('#storyAudience').value;if(!text&&!file)throw Error('Добавь текст или медиа.');const path=file?await upload('nova-social-media',file,S.user.id):null;await query(db.from('stories').insert({user_id:S.user.id,text_content:text,audience,media_type:file?(file.type.startsWith('video/')?'video':'image'):'text',media_path:path}));$('#modal').close();toast('История опубликована');if(S.page==='feed')await feed()})}}function viewStory(s){modal(S.people.get(s.user_id)?.display_name||'История',`${s.media_path?(s.media_type==='video'?`<video class="dialog-media" controls playsinline data-bucket="nova-social-media" data-path="${esc(s.media_path)}"></video>`:`<img class="dialog-media" alt="История" data-bucket="nova-social-media" data-path="${esc(s.media_path)}">`):''}<p class="post-text">${esc(s.text_content)}</p><p class="small muted">${clock(s.created_at)} · до ${clock(s.expires_at)}</p>`);query(db.from('story_views').upsert({story_id:s.id,user_id:S.user.id},{onConflict:'story_id,user_id',ignoreDuplicates:true})).catch(cons function clipComposer(){modal('Новый NOVA Clip',`<form id="clipForm" class="stack"><button type="button" class="soft" id="clipFile">${ic('video')} Выбрать видео</button><span id="clipFilename" class="small muted"></span><textarea id="clipCaption" rows="3" maxlength="2200" placeholder="Подпись к видео"></textarea><label class="field"><span>Видимость</span><select id="clipVisibility"><option value="public">Все пользователи</option><option value="followers">Подписчики</option><option value="private">Только я</option></select></label><p class="small muted">MP4, WebM или MOV · до 50 МБ</p><button class="primary">Опубликовать</button></form>`);let file=null;$('#clipFile').onclick=async()=>{file=await pick('video/*');if(file&&$('#clipFilename'))$('#clipFilename').textContent=file.name};$('#clipForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{if(!file||!file.type.startsWith('video/'))throw Error('Выбери видео.');const caption=$('#clipCaption').value.trim(),visibility=$('#clipVisibility').value,path=await upload('nova-social-media',file,S.user.id);await query(db.from('clips').insert({user_id:S.user.id,caption,visibility,media_path:path,video_url:path}));$('#modal').close();await go('clips');toast('Видео опубликовано')})}}async function clips(){const gen=S.gen,rows=await query(db.from('clips').select('*').order('created_at',{ascending:false}).limit(20));await people(rows.map(r=>r.user_id));if(gen!==S.gen||S.page!=='clips')return;$('#main').innerHTML=section('NOVA Clips','Маленькие видео. Большие моменты.',rows.map(c=>`<article class="clip">${c.media_path?`<video controls playsinline preload="metadata" data-bucket="nova-social-media" data-path="${esc(c.media_path)}"></video>`:'<div class="empty-list">Видео предыдущей версии</div>'}<div class="clip-info"><div class="row">${avatar(c.user_id)}<div><b>${esc(S.people.get(c.user_id)?.display_name||'Пользователь')}</b><div class="small muted">${day(c.created_at)}</div></div></div><p class="post-text">${esc(c.caption)}</p></div></article>`).join('')||'<div class="empty-list">Пока ни одного видео.<br>Сними момент, которым хочется поделиться.</div>',`<button class="icon" id="addClip" aria-label="Добавить видео">${ic('plus')}</button>`);$('#addClip').onclick=clipComposer;hydrate()}
function parseTopics(v){const topics=[...new Set(v.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean))];if(topics.length>10||topics.some(t=>t.length>50))throw Error('До 10 тем, каждая — до 50 символов.');return topics}async function setting(patch){await query(db.from('user_settings').update(patch).eq('user_id',S.user.id));Object.assign(S.settings,patch);prefs()}
async function profile(){const p=S.profile,s=S.settings;$('#main').innerHTML=section('Профиль','Всё, что делает NOVA твоей.',`<div class="card profile-top">${avatar(p.id,'big')}<h2>${esc(p.display_name)}</h2><p class="small muted">@${esc(p.username)}</p><button id="changeAvatar" class="soft">Изменить фото</button></div><form id="profileForm" class="card"><h3>Личные данные</h3><label class="field"><span>Имя</span><input id="profileName" value="${esc(p.display_name)}" maxlength="60" required></label><label class="field"><span>Username</span><input id="profileUsername" value="${esc(p.username)}" pattern="[A-Za-z0-9_]{3,24}" minlength="3" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" title="От 3 до 24 символов: латинские буквы, цифры и подчёркивание, без @" required><span class="small muted">3–24 символа: латинские буквы, цифры и подчёркивание, без @.</span></label><label class="field"><span>О себе</span><textarea id="profileBio" rows="3" maxlength="300">${esc(p.bio)}</textarea></label><button class="primary">Сохранить профиль</button></form><div class="card"><h3>Кастомизация профиля</h3><div class="theme-grid">${[['burgundy','Бордовый · бежевый','#843746','#f6f1e9'],['green','Зелёный · бежевый','#38674d','#f2f2e9'],['bw','Чёрный · белый','#222','#fff'],['blue','Синий · белый','#30649e','#fff']].map(([t,n,a,b])=>`<button class="theme-option ${s.theme===t?'selected':''}" data-theme="${t}"><span class="swatch" style="background:linear-gradient(90deg,${a} 50%,${b} 50%)"></span>${n}</button>`).join('')}</div><label class="setting"><span>Уменьшить анимацию</span><input type="checkbox" data-setting="reduced_motion" ${s.reduced_motion?'checked':''}></label></div><div class="card"><h3>Приватность</h3><label class="setting"><span>Закрытый профиль</span><input id="privateProfile" type="checkbox" ${p.is_private?'checked':''}></label><label class="setting"><span>Кто может начать диалог</span><select id="allowMessages"><option value="everyone">Все</option><option value="contacts">Мои подписки</option><option value="nobody">Никто</option></select></label><label class="setting"><span>Отправлять отметки о прочтении</span><input type="checkbox" data-setting="read_receipts" ${s.read_receipts?'checked':''}></label><button class="text-btn" id="requests">Запросы на подписку</button> · <button class="text-btn" id="blocks">Заблокированные</button></div><div class="card"><h3>Уведомления и лента</h3><label class="setting"><span>Уведомления в приложении</span><input type="checkbox" data-setting="notifications" ${s.notifications?'checked':''}></label><label class="setting"><span>Рекомендации по интересам</span><input type="checkbox" data-setting="recommendations" ${s.recommendations?'checked':''}></label><label class="field"><span>Интересы через запятую · до 10</span><input id="interests" maxlength="500" placeholder="дизайн, музыка, путешествия"></label><button class="soft" id="saveInterests">Сохранить интересы</button></div><div class="card"><h3>Аккаунт и безопасность</h3><div class="setting"><span>Email</span><span class="small muted truncate">${esc(S.user.email||'Не указан')}</span></div><div class="stack" style="margin-top:15px"><button class="soft" id="changeEmail">Изменить email</button><button class="soft" id="changePassword">Изменить пароль</button><button class="soft" id="signOutAll">Выйти на всех устройствах</button><button class="danger" id="signOut">Выйти из NOVA</button></div></div>`);$('#allowMessages').value=s.allow_messages||'everyone';$('#profileForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{const data={display_name:$('#profileName').value.trim(),username:$('#profileUsername').value.trim(),bio:$('#profileBio').value.trim()};if(!data.display_name)throw Error('Укажи имя.');S.profile=await query(db.from('profiles').update(data).eq('id',p.id).select().single());S.people.set(p.id,S.profile);$('#accountName').textContent=S.profile.display_name;await profile();toast('Профиль сохранён')})};click('#changeAvatar',async()=>{const file=await pick('image/jpeg,image/png,image/webp,image/gif');if(!file)return;const path=await upload('nova-avatars',file,S.user.id);await query(db.from('profiles').update({avatar_url:path}).eq('id',p.id));S.profile.avatar_url=path;S.people.set(p.id,S.profile);await profile();hydrate();toast('Фото обновлено')});$$('[data-theme]').forEach(b=>b.onclick=()=>run(b,async()=>{const old=S.settings.theme;theme(b.dataset.theme);try{await setting({theme:b.dataset.theme});$$('[data-theme]').forEach(x=>x.classList.toggle('selected',x===b))}catch(err){theme(old);throw err}}));$$('[data-setting]').forEach(el=>el.onchange=()=>{const value=el.checked;el.disabled=true;setting({[el.dataset.setting]:value}).catch(err=>{el.checked=!value;fail(err)}).finally(()=>el.disabled=false)});$('#privateProfile').onchange=e=>{const el=e.target,v=el.checked;el.disabled=true;query(db.from('profiles').update({is_private:v}).eq('id',p.id)).then(()=>S.profile.is_private=v).catch(err=>{el.checked=!v;fail(err)}).finally(()=>el.disabled=false)};$('#allowMessages').onchange=e=>setting({allow_messages:e.target.value}).catch(fail);click('#requests',requests);click('#blocks',blocks);click('#changeEmail',emailDialog);click('#changePassword',passwordDialog);click('#signOut',()=>logout('local'));click('#signOutAll',()=>{modal('Выйти везде?',`<p class="small muted">Завершим обновление сессий на всех устройствах. Выданные токены действуют до истечения срока.</p><button class="danger" id="confirmLogout">Выйти на всех устройствах</button>`);click('#confirmLogout',()=>logout('global'))});click('#saveInterests',async()=>{await query(db.rpc('nova_set_interests',{p_topics:parseTopics($('#interests').value)}));toast('Интересы сохранены')});query(db.from('user_interests').select('topic').eq('user_id',p.id)).then(rows=>{if($('#interests'))$('#interests').value=rows.map(x=>x.topic).join(', ')}).catch(fail);hydrate()}
async function requests(){const rows=await query(db.from('follow_requests').select('user_id').eq('target_id',S.user.id));await people(rows.map(r=>r.user_id));modal('Запросы на подписку',rows.map(r=>`<div class="person">${avatar(r.user_id)}<b class="grow">${esc(S.people.get(r.user_id)?.display_name||'Пользователь')}</b><button class="soft" data-accept="${r.user_id}">Принять</button><button data-reject="${r.user_id}" aria-label="Отклонить">×</button></div>`).join('')||'<p class="small muted">Новых запросов нет.</p>');$$('[data-accept]').forEach(b=>b.onclick=()=>run(b,async()=>{await query(db.rpc('nova_accept_follow',{p_user:b.dataset.accept}));await requests()}));$$('[data-reject]').forEach(b=>b.onclick=()=>run(b,async()=>{await query(db.from('follow_requests').delete().eq('user_id',b.dataset.reject).eq('target_id',S.user.id));await requests()}))}async function blocks(){const rows=await query(db.from('user_blocks').select('blocked_id').eq('user_id',S.user.id));await people(rows.map(r=>r.blocked_id));modal('Заблокированные',rows.map(r=>`<div class="person">${avatar(r.blocked_id)}<b class="grow">${esc(S.people.get(r.blocked_id)?.display_name||'Пользователь')}</b><button class="soft" data-unblock="${r.blocked_id}">Разблокировать</button></div>`).join('')||'<p class="small muted">Здесь пока никого.</p>');$$('[data-unblock]').forEach(b=>b.onclick=()=>run(b,async()=>{await query(db.from('user_blocks').delete().eq('user_id',S.user.id).eq('blocked_id',b.dataset.unblock));await blocks()}))}
function emailDialog(){modal('Изменить email',`<form id="emailForm" class="stack"><p class="small muted">Смена email требует подтверждения по письму. Текущий адрес останется активным до завершения проверки.</p><input id="newEmail" type="email" autocomplete="email" placeholder="Новый email" required><button class="primary">Отправить подтверждение</button></form>`);$('#emailForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{await query(db.auth.updateUser({email:$('#newEmail').value.trim()},{emailRedirectTo:location.origin+location.pathname}));$('#modal').close();toast('Проверь письма для подтверждения смены email.')})}}function passwordDialog(){modal('Новый пароль',`<form id="passwordForm" class="stack"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Не менее 8 символов" required><input id="repeatPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Повтори пароль" required><button class="primary">Сохранить пароль</button></form>`);$('#passwordForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{if($('#newPassword').value!==$('#repeatPassword').value)throw Error('Пароли не совпадают.');await query(db.auth.updateUser({password:$('#newPassword').value}));$('#newPassword').value='';$('#repeatPassword').value='';$('#modal').close();toast('Пароль обновлён')})}}async function logout(scope){cancelRecord(true);await query(db.auth.signOut({scope}));$('#modal').close();await session(null)}
async function start(){try{if(!window.supabase?.createClient)throw Error('Не удалось загрузить подключение. Проверь интернет и повтори.');db=window.supabase.createClient(PROJECT,PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});db.auth.onAuthStateChange((event,value)=>{if(event==='PASSWORD_RECOVERY')setTimeout(passwordDialog,700);if(event==='USER_UPDATED'&&value)S.user=value.user;setTimeout(()=>session(value).catch(fail),0)});const data=await query(db.auth.getSession());await session(data.session)}catch(err){$('#bootText').textContent=errorText(err);$('#retryBoot').classList.remove('hidden')}}$('#retryBoot').onclick=()=>{if(S.user){const value={user:S.user};currentUser=undefined;session(value)}else location.reload()};window.addEventListener('offline',()=>{$('#connection').textContent='Нет интернета';toast('Нет интернета. Повтори отправку после подключения.')});window.addEventListener('online',()=>{if(S.user)chats().catch(fail)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user){chats().catch(fail);if(S.selected)messages().catch(fail);hydrate()}});setInterval(()=>{if(S.user&&!document.hidden)hydrate()},45000);window.addEventListener('beforeunload',()=>cancelRecord(true));start();
})();
</script></body></html>
